# Weekly update pull requests. Each one must pass ci like any other change.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python-dev:
        dependency-type: development
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly, day: monday }
    # The project is pinned to Python 3.12 (pyproject.toml); moving to a newer Python is a
    # deliberate change, not a weekly bump. Digest refreshes of 3.12-slim still arrive.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: terraform
    directories: [/deploy/terraform/bootstrap, /deploy/terraform/envs/demo]
    schedule: { interval: monthly }
