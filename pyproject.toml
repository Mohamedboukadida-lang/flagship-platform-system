[project]
name = "lotse"
version = "0.1.0"
description = "Multi-tenant, privacy-first AI assistant platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Ranges here, exact versions in uv.lock. Raise a floor only with a reason.
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-sdk>=1.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/lotse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]
extend-exclude = ["docs"]   # the spec holds reference sketches, not code to format

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "ASYNC", "RUF", "C4", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106", "S608"]   # asserts and fixed test credentials
"backend/src/lotse/seed.py" = ["T201"]                  # a CLI script prints its result

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "asyncpg.*"   # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.importlinter]
root_package = "lotse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not import feature modules"
type = "forbidden"
source_modules = ["lotse.core"]
forbidden_modules = ["lotse.modules", "lotse.main"]

[[tool.importlinter.contracts]]
name = "service.py imports no web framework"
type = "forbidden"
source_modules = ["lotse.modules.*.service"]
forbidden_modules = ["fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only core.db talks to the database driver"
type = "forbidden"
source_modules = ["lotse"]
forbidden_modules = ["asyncpg"]
ignore_imports = ["lotse.core.db -> asyncpg"]
allow_indirect_imports = true
