{{- $name := include "lotse.name" . -}}
{{- $db := include "lotse.dbHost" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels: {{- include "lotse.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "lotse.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "lotse.labels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        # Roll the pods when the configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 40
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "lotse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: {{ $name }}-config }
          env:
            {{- include "lotse.secretEnv" (dict "ctx" . "key" "LOTSE_APP_DB_PASSWORD") | nindent 12 }}
            {{- include "lotse.secretEnv" (dict "ctx" . "key" "LOTSE_PLATFORM_DB_PASSWORD") | nindent 12 }}
            # $(VAR) is expanded by Kubernetes from the entries above.
            - name: LOTSE_DATABASE_URL
              value: postgresql+asyncpg://lotse_app:$(LOTSE_APP_DB_PASSWORD)@{{ $db }}:5432/lotse
            - name: LOTSE_PLATFORM_DATABASE_URL
              value: postgresql://lotse_platform:$(LOTSE_PLATFORM_DB_PASSWORD)@{{ $db }}:5432/lotse
          securityContext:
            {{- include "lotse.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          # Keep serving while the endpoint is removed from the Service.
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels: {{- include "lotse.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  selector: {{- include "lotse.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
