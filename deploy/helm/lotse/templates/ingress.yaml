{{- if .Values.ingress.enabled }}
{{- $name := include "lotse.name" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "lotse.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ $name }}-tls
  {{- end }}
  rules:
    - host: {{ required "host is required" .Values.host | quote }}
      http:
        paths:
          - path: {{ .Values.api.prefix }}
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-api, port: { name: http } }
          {{- if .Values.keycloak.enabled }}
          # Only what a login needs. /auth/admin, /auth/metrics and /auth/health stay inside.
          {{- range $path := list "/auth/realms" "/auth/resources" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-keycloak, port: { name: http } }
          {{- end }}
          {{- end }}
{{- end }}
