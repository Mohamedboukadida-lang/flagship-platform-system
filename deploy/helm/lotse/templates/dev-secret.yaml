{{- if .Values.secrets.create }}
# Throwaway clusters only. A real deployment brings its own Secret (secrets.create: false).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lotse.secretName" . }}
  labels: {{- include "lotse.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
stringData: {{- toYaml .Values.secrets.values | nindent 2 }}
{{- end }}
