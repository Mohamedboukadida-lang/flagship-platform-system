{{- if .Values.redis.enabled }}
{{- $name := include "lotse.name" . -}}
# Cache, rate limits and stream fan-out only: nothing here is a source of truth, so no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-redis
  labels: {{- include "lotse.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "lotse.selector" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "lotse.labels" (dict "ctx" . "component" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # the redis user of the image
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379, name: redis }]
          securityContext:
            {{- include "lotse.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 10, failureThreshold: 6 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-redis
  labels: {{- include "lotse.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  selector: {{- include "lotse.selector" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports: [{ name: redis, port: 6379, targetPort: redis }]
{{- end }}
